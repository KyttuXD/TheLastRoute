# Builds the Last Route route server (lr_server) and installs it on vps3 (lastroute.kyttuslab.org, the lastroute-rust
# service) on every push to main that changes server code. The install is packaging-free: the restricted lr-server-deploy
# user uploads the binary to its incoming folder and runs /usr/local/sbin/lr-server-swap with the expected sha256. That
# script stops the service, keeps the old binary under /opt/lastroute-rust/previous, installs the new one, checks
# /api/health and rolls back on a failed check. A restart drops players connected to the route server.
# Secrets (repository settings, never in the repo): DEPLOY_SSH_KEY_SERVER (private key of lr-server-deploy on vps3) and
# DEPLOY_KNOWN_HOSTS_SERVER (vps3's host key line). The deploy user may run only the swap script, through sudo.
name: deploy-server
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: production
      url: https://lastroute.kyttuslab.org
    steps:
      - uses: actions/checkout@v6
      - name: Linux packages
        run: sudo apt-get install -y libasound2-dev || (sudo apt-get update && sudo apt-get install -y libasound2-dev)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: server-deploy
      - name: Build lr_server
        run: cargo build --release --locked --bin lr_server --features server
      - name: Record the binary's sha256
        run: |
          sha256sum target/release/lr_server | cut -d' ' -f1 > lr_server.sha256
          echo "sha256: $(cat lr_server.sha256)"
      - name: SSH setup
        env:
          DEPLOY_SSH_KEY_SERVER: ${{ secrets.DEPLOY_SSH_KEY_SERVER }}
          DEPLOY_KNOWN_HOSTS_SERVER: ${{ secrets.DEPLOY_KNOWN_HOSTS_SERVER }}
        run: |
          test -n "$DEPLOY_SSH_KEY_SERVER" || { echo "DEPLOY_SSH_KEY_SERVER secret is not set" >&2; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY_SERVER" > ~/.ssh/lr_server_deploy && chmod 600 ~/.ssh/lr_server_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS_SERVER" > ~/.ssh/known_hosts
          printf 'Host vps3\n  HostName 194.156.90.219\n  User lr-server-deploy\n  IdentityFile ~/.ssh/lr_server_deploy\n  IdentitiesOnly yes\n' > ~/.ssh/config
      - name: Upload the binary
        run: scp target/release/lr_server vps3:incoming/lr_server
      - name: Install it and check the health
        run: ssh vps3 "sudo -n /usr/local/sbin/lr-server-swap $(cat lr_server.sha256)"
      - name: Summary
        if: always()
        run: |
          echo "- route server deploy: ${{ job.status }} (commit ${GITHUB_SHA}, binary $(cat lr_server.sha256 2>/dev/null))" >> "$GITHUB_STEP_SUMMARY"
