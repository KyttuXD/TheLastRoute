# Builds the port for Windows, Linux and macOS: one universal app (Apple Silicon + Intel) and an
# Intel-only app for kt-mba. The two macOS slices build in parallel jobs (macos-intel and
# macos-arm64) and a final macos-universal job joins them with packaging/macos/universal.sh.
# Every build is uploaded as a run artifact, and on main also published to the rolling "nightly"
# pre-release, which is replaced in place on each push (Actions artifact storage is full on this
# account, so nightly is where the builds are downloaded from). Use it from a private repository
# (see README: the build contains the original game's files and must not be shared).
# The Rust version is pinned in rust-toolchain.toml; the workflows install the same version.
# Each job writes its wall-clock build time to the run summary.
name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Start job clock
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: cargo build --release --bins --features server
      # The self-test needs an OpenGL pixel format, which hosted Windows runners do not have, so it
      # runs locally instead (last_route --self-test). The headless suite runs in test.yml.
      - name: Collect the Windows builds
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/last_route.exe dist/last_route-windows-x86_64.exe
          cp target/release/night_watch.exe dist/night_watch-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: last_route-windows
          retention-days: 3
          path: |
            dist/last_route-windows-x86_64.exe
            dist/night_watch-windows-x86_64.exe
      - name: Publish to nightly
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last_route-windows-x86_64.exe dist/night_watch-windows-x86_64.exe
      - name: Publish to the VPS (automatic updates)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          NIGHTLY_SSH_KEY: ${{ secrets.NIGHTLY_SSH_KEY }}
          NIGHTLY_KNOWN_HOSTS: ${{ secrets.NIGHTLY_KNOWN_HOSTS }}
        run: sh packaging/publish-vps.sh windows dist/last_route-windows-x86_64.exe
      - name: Build time to the run summary
        if: always()
        shell: bash
        run: echo "- windows: $(( $(date +%s) - JOB_START )) s" >> "$GITHUB_STEP_SUMMARY"

  linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Start job clock
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - run: sh packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: last_route-linux-x86_64, path: dist/last-route-linux-x86_64.tar.gz, retention-days: 3 }
      - name: Publish to nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last-route-linux-x86_64.tar.gz
      - name: Publish to the VPS (automatic updates)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          NIGHTLY_SSH_KEY: ${{ secrets.NIGHTLY_SSH_KEY }}
          NIGHTLY_KNOWN_HOSTS: ${{ secrets.NIGHTLY_KNOWN_HOSTS }}
        run: sh packaging/publish-vps.sh linux dist/last-route-linux-x86_64.tar.gz
      # The server alone, for updating the VPS: its own rolling release, nightly-server.
      - name: Collect the server build
        run: |
          mkdir -p dist
          cp target/release/lr_server dist/lr_server-linux-x86_64
          sha256sum dist/lr_server-linux-x86_64 > dist/lr_server-linux-x86_64.sha256
      - name: Publish the server to nightly-server
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: nightly-server
          NIGHTLY_TITLE: Nightly server (Linux x86_64)
        run: sh packaging/nightly.sh dist/lr_server-linux-x86_64 dist/lr_server-linux-x86_64.sha256
      - name: Build time to the run summary
        if: always()
        shell: bash
        run: echo "- linux: $(( $(date +%s) - JOB_START )) s" >> "$GITHUB_STEP_SUMMARY"

  # One macOS slice per job, in parallel. Each job hands its .app bundles to macos-universal through
  # a run-scoped Actions cache, not an artifact: artifact storage is full on this account, and a
  # cache keeps the file modes that artifact zips drop. The slice is also uploaded as an artifact
  # (continue-on-error, like the others) so it can be fetched by hand.
  macos-intel:
    # Intel runner for the x86_64 slice.
    runs-on: macos-15-intel
    steps:
      - name: Start job clock
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-intel
      - name: Build the Intel apps
        env:
          ARCHS: x86_64-apple-darwin
        run: sh packaging/macos/build_app.sh
      - name: Pack the Intel slice
        run: tar -czf dist/macos-intel-slice.tar.gz -C dist intel
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: macos-intel-slice, path: dist/macos-intel-slice.tar.gz, retention-days: 3 }
      - name: Hand the Intel slice to macos-universal
        uses: actions/cache/save@v4
        with:
          path: dist/macos-intel-slice.tar.gz
          key: macos-slice-intel-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build time to the run summary
        if: always()
        shell: bash
        run: echo "- macos-intel: $(( $(date +%s) - JOB_START )) s" >> "$GITHUB_STEP_SUMMARY"

  # The Apple Silicon slice. macos-15 is the Apple Silicon image.
  macos-arm64:
    runs-on: macos-15
    steps:
      - name: Start job clock
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-arm64
      - name: Build the Apple Silicon apps
        env:
          ARCHS: aarch64-apple-darwin
        run: sh packaging/macos/build_app.sh
      - name: Pack the Apple Silicon slice
        run: tar -czf dist/macos-arm64-slice.tar.gz -C dist arm64
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: macos-arm64-slice, path: dist/macos-arm64-slice.tar.gz, retention-days: 3 }
      - name: Hand the Apple Silicon slice to macos-universal
        uses: actions/cache/save@v4
        with:
          path: dist/macos-arm64-slice.tar.gz
          key: macos-slice-arm64-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build time to the run summary
        if: always()
        shell: bash
        run: echo "- macos-arm64: $(( $(date +%s) - JOB_START )) s" >> "$GITHUB_STEP_SUMMARY"

  # Joins the two slices into the universal zips, then uploads and publishes them. Publishing comes
  # after the upload steps in this job.
  macos-universal:
    needs: [macos-intel, macos-arm64]
    runs-on: macos-15
    steps:
      - name: Start job clock
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Restore the Intel slice
        uses: actions/cache/restore@v4
        with:
          path: dist/macos-intel-slice.tar.gz
          key: macos-slice-intel-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Restore the Apple Silicon slice
        uses: actions/cache/restore@v4
        with:
          path: dist/macos-arm64-slice.tar.gz
          key: macos-slice-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Unpack the slices
        shell: bash
        run: |
          tar -xzf dist/macos-intel-slice.tar.gz -C dist
          tar -xzf dist/macos-arm64-slice.tar.gz -C dist
      - name: Make the universal zips
        run: sh packaging/macos/universal.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: last_route-macos-universal, path: dist/last_route-macos-universal.zip, retention-days: 3 }
      # universal.sh also zips the Night Watch app (dist/night_watch-macos-universal.zip).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: night_watch-macos-universal, path: dist/night_watch-macos-universal.zip, retention-days: 3 }
      - name: Publish to nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last_route-macos-universal.zip dist/night_watch-macos-universal.zip
      - name: Publish to the VPS (automatic updates)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          NIGHTLY_SSH_KEY: ${{ secrets.NIGHTLY_SSH_KEY }}
          NIGHTLY_KNOWN_HOSTS: ${{ secrets.NIGHTLY_KNOWN_HOSTS }}
        run: sh packaging/publish-vps.sh macos dist/last_route-macos-universal.zip
      - name: Build time to the run summary
        if: always()
        shell: bash
        run: echo "- macos-universal: $(( $(date +%s) - JOB_START )) s" >> "$GITHUB_STEP_SUMMARY"

# The universal zip holds the Intel (x86_64) slice too, so kt-mba takes that file.
