# Builds the port for Windows, Linux, macOS Intel and macOS Apple Silicon. Each build is published to a
# rolling pre-release in Releases (not Actions artifacts): "nightly" for the game, "nightly-server" for the
# Linux server. The release is replaced in place on every push to main (packaging/nightly.sh).
# Intel and Apple Silicon macOS are separate builds and separate files: last_route-macos-x86_64.zip and
# last_route-macos-arm64.zip. The legacy Intel Mac app (OS X 10.5 to 10.11, docs/MACOS_SNOW_LEOPARD.md) is one more
# file of the same "nightly" release, last_route-macos-legacy.zip: its two jobs are continue-on-error and
# nothing needs them, so a failure there never blocks the other builds. macos-legacy (the slowest, about 10 minutes) runs as its
# own workflow, build-legacy.yml, so this run is not held up by it; macos-legacy-renderer stays here. The repository is public, so GitHub-hosted runners (including macOS) are free.
name: build
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          key: windows
      - name: Build times header
        shell: bash
        run: |
          printf '### Build times (windows)\n\n| step | os | cache | elapsed |\n|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
      - name: cargo build --release
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          t0=$(date +%s); date -u +"start %FT%TZ"
          trap 'echo "| cargo build --release | ${{ runner.os }} | cache-hit: ${CACHE_HIT:-n/a} | $(( $(date +%s) - t0 ))s |" >> "$GITHUB_STEP_SUMMARY"; date -u +"end   %FT%TZ"' EXIT
          cargo build --release --bin last_route
      - name: Collect the Windows builds
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/last_route.exe dist/last_route-windows-x86_64.exe

      - name: Publish to nightly
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last_route-windows-x86_64.exe
      # The launcher (docs/LAUNCHER.md) rides along with the nightly build so an existing device can install it. It is
      # small and never compiles the game; a failure here must not stop the game build from publishing.
      - name: Build and publish the launcher
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --release -p lr_launcher --bin lr_launcher
          cp target/release/lr_launcher.exe dist/lr_launcher-windows-x86_64.exe
          sh packaging/nightly.sh dist/lr_launcher-windows-x86_64.exe
      # The signed native build the launcher and the in-game updater read from the nightly release (docs/LAUNCHER.md).
      # A signing problem must never stop the game build, so this step may fail. macOS-universal is not built by CI yet.
      - name: Publish the signed native build
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LR_NATIVE_SIGNING_KEY: ${{ secrets.LR_NATIVE_SIGNING_KEY }}
        run: |
          if [ -z "$LR_NATIVE_SIGNING_KEY" ]; then
            echo "::notice::LR_NATIVE_SIGNING_KEY is not set; the signed native build was not published"
            exit 0
          fi
          umask 077
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$LR_NATIVE_SIGNING_KEY" > "$KEY_FILE"
          SIGN_KEY="$KEY_FILE" \
            sh packaging/native/publish-github.sh windows-x86_64 dist/last_route-windows-x86_64.exe "${{ github.run_number }}" "${{ github.sha }}"

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # packaging/linux/build.sh also builds lr_server with --features server (a different crate graph from the plain game
      # build), so this cache is keyed "linux-server", apart from the plain builds (windows, macos, nightly-*.yml).
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          key: linux-server
      - run: sudo apt-get install -y libasound2-dev || (sudo apt-get update && sudo apt-get install -y libasound2-dev)
      - name: Build times header
        shell: bash
        run: |
          printf '### Build times (linux)\n\n| step | os | cache | elapsed |\n|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
      - name: packaging/linux/build.sh
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          t0=$(date +%s); date -u +"start %FT%TZ"
          trap 'echo "| packaging/linux/build.sh | ${{ runner.os }} | cache-hit: ${CACHE_HIT:-n/a} | $(( $(date +%s) - t0 ))s |" >> "$GITHUB_STEP_SUMMARY"; date -u +"end   %FT%TZ"' EXIT
          sh packaging/linux/build.sh
      - name: Publish to nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last-route-linux-x86_64.tar.gz
      - name: Build and publish the launcher
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --release -p lr_launcher --bin lr_launcher
          cp target/release/lr_launcher dist/lr_launcher-linux-x86_64
          sh packaging/nightly.sh dist/lr_launcher-linux-x86_64
      # The signed native build the launcher and the in-game updater read from the nightly release (docs/LAUNCHER.md).
      # A signing problem must never stop the game build, so this step may fail. macOS-universal is not built by CI yet.
      - name: Publish the signed native build
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LR_NATIVE_SIGNING_KEY: ${{ secrets.LR_NATIVE_SIGNING_KEY }}
        run: |
          if [ -z "$LR_NATIVE_SIGNING_KEY" ]; then
            echo "::notice::LR_NATIVE_SIGNING_KEY is not set; the signed native build was not published"
            exit 0
          fi
          umask 077
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$LR_NATIVE_SIGNING_KEY" > "$KEY_FILE"
          SIGN_KEY="$KEY_FILE" \
            sh packaging/native/publish-github.sh linux-x86_64 dist/last-route-linux-x86_64.tar.gz "${{ github.run_number }}" "${{ github.sha }}"
      - name: Collect the server build
        run: |
          mkdir -p dist
          cp target/release/lr_server dist/lr_server-linux-x86_64
          sha256sum dist/lr_server-linux-x86_64 > dist/lr_server-linux-x86_64.sha256
      - name: Publish the server to nightly-server
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: nightly-server
          NIGHTLY_TITLE: Nightly server (Linux x86_64)
        run: sh packaging/nightly.sh dist/lr_server-linux-x86_64 dist/lr_server-linux-x86_64.sha256

  # Intel Mac: its own build, its own zip.
  # Records the native side of production: one deployment per push, linked to the nightly release and
  # paired with the web deployment (deploy-web.yml) through the same commit. Runs only after all native builds.
  production:
    needs: [windows, linux, macos-intel, macos-arm64]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    environment:
      name: production
      url: https://github.com/KyttuXD/TheLastRoute/releases/tag/nightly
    steps:
      - name: Note the pairing in the run summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "- native release: https://github.com/KyttuXD/TheLastRoute/releases/tag/nightly (commit ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
          echo "- web: https://lastrouterust.games.kyttuslab.org (the web deploy for this commit is in deploy-web)" >> "$GITHUB_STEP_SUMMARY"

  # Built on the Apple Silicon runner (it is about twice as fast as the Intel one, which took 8 to 9 minutes): the
  # x86_64 target is cross-compiled, which packaging/macos/build_app.sh already does for a universal build.
  macos-intel:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          key: macos-intel
      - name: Build times header
        shell: bash
        run: |
          printf '### Build times (macos intel)\n\n| step | os | cache | elapsed |\n|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Build the Intel app
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          ARCHS: x86_64-apple-darwin
        run: |
          t0=$(date +%s); date -u +"start %FT%TZ"
          trap 'echo "| Build the Intel app | macOS Intel | cache-hit: ${CACHE_HIT:-n/a} | $(( $(date +%s) - t0 ))s |" >> "$GITHUB_STEP_SUMMARY"; date -u +"end   %FT%TZ"' EXIT
          sh packaging/macos/build_app.sh
      - name: Zip the Intel app
        run: (cd dist/intel && zip -qry ../last_route-macos-x86_64.zip "KYTTU The Last Route.app")
      - name: Publish to nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last_route-macos-x86_64.zip
      # One universal launcher app (Intel and Apple Silicon) for both Mac builds. Not yet run on a Mac (docs/LAUNCHER.md),
      # so it may fail without stopping the game build.
      - name: Build and publish the launcher
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh packaging/native/build-launcher.sh
          (cd dist/launcher && zip -qry ../lr_launcher-macos-universal.zip "KYTTU The Last Route.app")
          sh packaging/nightly.sh dist/lr_launcher-macos-universal.zip

  # Apple Silicon Mac: its own build, its own zip. Runs on the Apple Silicon runner image.
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          key: macos-arm64
      - name: Build times header
        shell: bash
        run: |
          printf '### Build times (macos arm64)\n\n| step | os | cache | elapsed |\n|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Build the Apple Silicon app
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          ARCHS: aarch64-apple-darwin
        run: |
          t0=$(date +%s); date -u +"start %FT%TZ"
          trap 'echo "| Build the Apple Silicon app | macOS arm64 | cache-hit: ${CACHE_HIT:-n/a} | $(( $(date +%s) - t0 ))s |" >> "$GITHUB_STEP_SUMMARY"; date -u +"end   %FT%TZ"' EXIT
          sh packaging/macos/build_app.sh
      - name: Zip the Apple Silicon app
        run: (cd dist/arm64 && zip -qry ../last_route-macos-arm64.zip "KYTTU The Last Route.app")
      - name: Publish to nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last_route-macos-arm64.zip

  # Legacy Intel Mac (OS X 10.5 to 10.11): docs/MACOS_SNOW_LEOPARD.md.
  # The legacy renderer (LR_MACOS_LEGACY=1) built with the normal compiler and its 10.12 runtime. A check only: it
  # publishes nothing.
  macos-legacy-renderer:
    runs-on: macos-15-intel
    continue-on-error: true
    env:
      CARGO_BUILD_JOBS: "4"
      LR_MACOS_LEGACY: "1"
      MACOSX_DEPLOYMENT_TARGET: "10.12"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-legacy-renderer
      - name: Build the game with the legacy renderer
        run: cargo build --locked --profile ci --target x86_64-apple-darwin --bin last_route
      - name: No Metal, MetalKit or Vision linked
        run: |
          otool -L target/x86_64-apple-darwin/ci/last_route | tee renderer-libraries.txt
          ! grep -E '/(Metal|MetalKit|Vision)\.framework/' renderer-libraries.txt
      # The OpenGL 2.1 smoke test skips itself when the runner has no accelerated pixel format.
      - name: Renderer unit tests
        run: |
          cp -R vendor/miniquad "$RUNNER_TEMP/lr-miniquad"
          cargo test --manifest-path "$RUNNER_TEMP/lr-miniquad/Cargo.toml" --lib --target x86_64-apple-darwin -- --test-threads=1 --nocapture
      - name: Headless test suites
        run: target/x86_64-apple-darwin/ci/last_route --headless --test-suite "tests/*.json" --out target/test-reports/legacy-renderer.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-legacy-renderer-reports
          path: |
            renderer-libraries.txt
            target/test-reports/legacy-renderer.json
          retention-days: 3
          if-no-files-found: warn

  # The legacy app itself, built with the MacPorts Darwin 10 compiler (Rust 1.77, emulated TLS): a runtime probe, then
  # the game build, then last_route-macos-legacy.zip goes to the nightly release next to the other builds.
