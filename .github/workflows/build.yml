# Builds the port for Windows, Linux and macOS (one universal Apple Silicon + Intel app).
# Artifacts only; nothing is published. Use it from a private repository (see README: the
# build contains the original game's files and must not be shared).
name: build
on: [push, workflow_dispatch]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - run: cargo build --release --bin lr_server
      - run: cargo run --release --bin last_route -- --self-test self-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: last_route-windows
          path: |
            target/release/last_route.exe
            target/release/lr_server.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - run: sh packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: last_route-linux-x86_64, path: dist/last-route-linux-x86_64.tar.gz }

  macos:
    # macos-14 was retired from GitHub Actions on 2026-11-02; macos-15 is the Apple Silicon image.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sh packaging/macos/build_app.sh
      - run: cd dist && zip -qry last_route-macos-universal.zip "Kyttu's Lab.app"
      - uses: actions/upload-artifact@v4
        with: { name: last_route-macos-universal, path: dist/last_route-macos-universal.zip }

  # Intel Mac build for kt-mba. build_app.sh always builds both slices, so the zip holds an
  # x86_64 binary (plus arm64); it runs on Intel. macos-15-intel is the Intel (x64) image.
  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: sh packaging/macos/build_app.sh
      - run: cd dist && zip -qry last_route-macos-x86_64.zip "Kyttu's Lab.app"
      - uses: actions/upload-artifact@v4
        with: { name: last_route-macos-x86_64, path: dist/last_route-macos-x86_64.zip }
