# Builds the port for Windows, Linux and macOS: one universal app (Apple Silicon + Intel) and an
# Intel-only app for kt-mba (both macOS jobs build both slices). Every build is uploaded as a run
# artifact, and on main also published to the rolling "nightly" pre-release, which is replaced in
# place on each push (Actions artifact storage is full on this account, so nightly is where the
# builds are downloaded from). Use it from a private repository (see README: the build contains the
# original game's files and must not be shared).
name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: cargo build --release --bins --features server
      # The self-test needs an OpenGL pixel format, which hosted Windows runners do not have, so it
      # runs locally instead (last_route --self-test). The headless suite runs in test.yml.
      - name: Collect the Windows builds
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/last_route.exe dist/last_route-windows-x86_64.exe
          cp target/release/night_watch.exe dist/night_watch-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: last_route-windows
          retention-days: 3
          path: |
            dist/last_route-windows-x86_64.exe
            dist/night_watch-windows-x86_64.exe
      - name: Publish to nightly
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last_route-windows-x86_64.exe dist/night_watch-windows-x86_64.exe
      - name: Publish to the VPS (automatic updates)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          NIGHTLY_SSH_KEY: ${{ secrets.NIGHTLY_SSH_KEY }}
          NIGHTLY_KNOWN_HOSTS: ${{ secrets.NIGHTLY_KNOWN_HOSTS }}
        run: sh packaging/publish-vps.sh windows dist/last_route-windows-x86_64.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - run: sh packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: last_route-linux-x86_64, path: dist/last-route-linux-x86_64.tar.gz, retention-days: 3 }
      - name: Publish to nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last-route-linux-x86_64.tar.gz
      - name: Publish to the VPS (automatic updates)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          NIGHTLY_SSH_KEY: ${{ secrets.NIGHTLY_SSH_KEY }}
          NIGHTLY_KNOWN_HOSTS: ${{ secrets.NIGHTLY_KNOWN_HOSTS }}
        run: sh packaging/publish-vps.sh linux dist/last-route-linux-x86_64.tar.gz
      # The server alone, for updating the VPS: its own rolling release, nightly-server.
      - name: Collect the server build
        run: |
          mkdir -p dist
          cp target/release/lr_server dist/lr_server-linux-x86_64
          sha256sum dist/lr_server-linux-x86_64 > dist/lr_server-linux-x86_64.sha256
      - name: Publish the server to nightly-server
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: nightly-server
          NIGHTLY_TITLE: Nightly server (Linux x86_64)
        run: sh packaging/nightly.sh dist/lr_server-linux-x86_64 dist/lr_server-linux-x86_64.sha256

  macos:
    # macos-14 was retired from GitHub Actions on 2026-11-02; macos-15 is the Apple Silicon image.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - run: sh packaging/macos/build_app.sh
      - run: cd dist && zip -qry last_route-macos-universal.zip "KYTTU The Last Route.app"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: last_route-macos-universal, path: dist/last_route-macos-universal.zip, retention-days: 3 }
      # build_app.sh also zips the Night Watch app (dist/night_watch-macos-universal.zip).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with: { name: night_watch-macos-universal, path: dist/night_watch-macos-universal.zip, retention-days: 3 }
      - name: Publish to nightly
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last_route-macos-universal.zip dist/night_watch-macos-universal.zip
      - name: Publish to the VPS (automatic updates)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          NIGHTLY_SSH_KEY: ${{ secrets.NIGHTLY_SSH_KEY }}
          NIGHTLY_KNOWN_HOSTS: ${{ secrets.NIGHTLY_KNOWN_HOSTS }}
        run: sh packaging/publish-vps.sh macos dist/last_route-macos-universal.zip

# The universal zip above already holds the Intel (x86_64) slice, so kt-mba takes that file. A separate
# macos-15-intel job compiled the same two slices again on a slower runner (about 8 minutes) and was removed.
