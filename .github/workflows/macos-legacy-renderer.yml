name: Intel legacy renderer checks

on:
  push:
    branches: [main, ci/macos-intel-artifact]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_TARGET_DIR: target/pass
  LR_MACOS_LEGACY: "1"
  # This checks the legacy renderer with the supported compiler runtime. It is
  # deliberately NOT advertised as a Snow Leopard-compatible game artifact.
  MACOSX_DEPLOYMENT_TARGET: "10.12"

jobs:
  legacy-renderer:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-intel-legacy-renderer
      - name: Compile game with legacy macOS API and GL paths
        run: cargo build --locked --profile ci --target x86_64-apple-darwin --bin last_route
      - name: Reject modern renderer framework dependencies
        run: |
          otool -L target/pass/x86_64-apple-darwin/ci/last_route | tee renderer-libraries.txt
          if grep -E '/(Metal|MetalKit|Vision)\.framework/' renderer-libraries.txt; then
            echo "Legacy renderer still requires a modern renderer framework" >&2
            exit 1
          fi
      - name: Compile renderer unit tests
        run: cargo test --locked --no-run -p miniquad --lib --target x86_64-apple-darwin --message-format=json > renderer-tests.jsonl
      - name: Run renderer tests, including OpenGL 2.1 smoke test
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          executables = set()
          for line in open('renderer-tests.jsonl'):
              event = json.loads(line)
              if event.get('reason') == 'compiler-artifact' and event.get('profile', {}).get('test') and event.get('executable'):
                  executables.add(event['executable'])
          assert executables, 'No renderer tests compiled'
          for executable in sorted(executables):
              subprocess.run([executable, '--test-threads=1', '--nocapture'], check=True)
          PY
      - name: Headless gameplay suites with legacy renderer build
        run: target/pass/x86_64-apple-darwin/ci/last_route --headless --test-suite "tests/*.json" --out target/test-reports/legacy-renderer.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel-legacy-renderer-reports-not-a-10.6-game
          path: |
            renderer-libraries.txt
            target/test-reports/legacy-renderer.json
          if-no-files-found: warn
