# Runs the default Rust tests, the headless game suite and the self-test on Windows and Linux.
# Only default tests run here: the full Godot golden tests (#[ignore], need PARITY_DIR and the
# golden files) are not in CI. Nothing is published; reports are private run artifacts.
name: test
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ext: ".exe"
          - os: ubuntu-22.04
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb

      # The repo has no rust-toolchain file, so this is the runner's stable Rust.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # One run over one crate graph. No src or tests file is cfg-gated on the server feature, so
      # the lib and last_route suites run the same tests as before; the feature only adds lr_server.
      - name: cargo test --lib --bin last_route --bin lr_server
        run: cargo test --locked --lib --bin last_route --bin lr_server --features server

      - name: Build release binaries
        run: cargo build --locked --release --bins --features server

      # Exit 0 pass, 1 fail, 2 nothing ran. The JSON report is kept as an artifact.
      - name: Headless test suites
        run: ./target/release/last_route${{ matrix.ext }} --test-suite "tests/*.json" --out target/ci/suite-report.json

      # The self-test is not run here: it needs a real OpenGL context and an audio device, which
      # hosted runners do not have (Windows fails on the pixel format and hangs). Run it locally.

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: test-reports-${{ matrix.os }}
          path: target/ci/
          retention-days: 3
          if-no-files-found: warn
