# Runs the default Rust tests, the headless game suite and the self-test on Windows and Linux.
# Only default tests run here: the full Godot golden tests (#[ignore], need PARITY_DIR and the
# golden files) are not in CI. Nothing is published; reports are private run artifacts.
#
# Cost: Windows minutes bill at 2x, so a push runs Linux only; Windows runs by hand (workflow_dispatch) and
# once a week (Monday 06:00 UTC), which still catches line-ending and path differences.
name: test
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "tools/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-22.04"]' || '["ubuntu-22.04","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb

      # The Rust version is pinned in rust-toolchain.toml; this installs the same version (keep both in step).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # One run over one crate graph. No src or tests file is cfg-gated on the server feature, so
      # the lib and last_route suites run the same tests as before; the feature only adds lr_server.
      - name: cargo test --profile ci --lib --bin last_route --bin lr_server
        run: cargo test --locked --profile ci --lib --bin last_route --bin lr_server --features server

      # The ci profile is the test profile without full debug info, and it reuses the test build's
      # dependency artifacts. A separate release build was a second full compile of the crate.
      - name: Build ci binaries
        run: cargo build --locked --profile ci --bins --features server

      # Exit 0 pass, 1 fail, 2 nothing ran. The JSON report is kept as an artifact.
      - name: Headless test suites
        run: ./target/ci/last_route${{ runner.os == 'Windows' && '.exe' || '' }} --test-suite "tests/*.json" --out target/test-reports/suite-report.json

      # The self-test is not run here: it needs a real OpenGL context and an audio device, which
      # hosted runners do not have (Windows fails on the pixel format and hangs). Run it locally.

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: test-reports-${{ matrix.os }}
          path: target/test-reports/
          retention-days: 3
          if-no-files-found: warn
