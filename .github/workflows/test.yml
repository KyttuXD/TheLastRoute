# Runs the default Rust tests, the headless game suite and the self-test on Windows and Linux.
# Only default tests run here: the full Godot golden tests (#[ignore], need PARITY_DIR and the
# golden files) are not in CI. Nothing is published; reports are private run artifacts.
#
# Cost: Windows minutes bill at 2x, so a push runs Linux only; Windows runs by hand (workflow_dispatch) and
# once a week (Monday 06:00 UTC), which still catches line-ending and path differences.
name: test
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
      - "tools/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    # Two halves side by side, so a push is checked in the time of the longer one (docs/CI_SPEED_PLAN.md):
    #   unit:   the game's unit tests (the one large test program)
    #   suites: the library's and the server's tests, the game built for the headless suites, the other programs checked
    name: test (${{ matrix.part }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-22.04"]' || '["ubuntu-22.04","windows-latest"]') }}
        part: [unit, suites]
    steps:
      - uses: actions/checkout@v6

      # Only the link name -lasound is needed (the game declares its ALSA calls itself), so the runtime library the image
      # already has is enough with a libasound.so link; the -dev package is installed only if that library is missing.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          L=/usr/lib/x86_64-linux-gnu
          ls $L/libasound* || true
          if [ ! -e $L/libasound.so ]; then
            if [ -e $L/libasound.so.2 ]; then sudo ln -s $L/libasound.so.2 $L/libasound.so
            else sudo apt-get install -y libasound2-dev || (sudo apt-get update && sudo apt-get install -y libasound2-dev); fi
          fi

      # The Rust version is pinned in rust-toolchain.toml; this installs the same version (keep both in step).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      # Server deps split: every job here builds with --features server, which compiles a different crate graph from the
      # plain game build (build.yml windows, nightly-*.yml), so this key carries "server". Sharing one key between the two
      # graphs makes each run overwrite the other's cache. build.yml's linux job (it also builds lr_server) uses linux-server.
      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          key: test-server-${{ matrix.os }}-${{ matrix.part }}

      - name: Build times header
        shell: bash
        run: |
          printf '### Build times (test ${{ matrix.part }}, ${{ matrix.os }})\n\n| step | os | cache | elapsed |\n|---|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"

      # One run over one crate graph. No src or tests file is cfg-gated on the server feature, so
      # the lib and last_route suites run the same tests as before; the feature only adds lr_server.
      - name: cargo test --profile ci
        if: matrix.part == 'unit'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          t0=$(date +%s); date -u +"start %FT%TZ"
          trap 'echo "| cargo test --profile ci | ${{ runner.os }} | cache-hit: ${CACHE_HIT:-n/a} | $(( $(date +%s) - t0 ))s |" >> "$GITHUB_STEP_SUMMARY"; date -u +"end   %FT%TZ"' EXIT
          cargo test --locked --profile ci --bin last_route --features server

      # The ci profile is the test profile without full debug info, and it reuses the test build's
      # dependency artifacts. A separate release build was a second full compile of the crate.
      # Only the game is built (the headless suites below run it). The other programs are type-checked, which is
      # enough to catch a break in them and costs a fraction of building and linking four more programs.
      - name: cargo test --profile ci (library and server)
        if: matrix.part == 'suites'
        shell: bash
        run: cargo test --locked --profile ci --lib --bin lr_server --features server

      - name: cargo build --profile ci --bins
        if: matrix.part == 'suites'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          t0=$(date +%s); date -u +"start %FT%TZ"
          trap 'echo "| cargo build --profile ci --bins | ${{ runner.os }} | cache-hit: ${CACHE_HIT:-n/a} | $(( $(date +%s) - t0 ))s |" >> "$GITHUB_STEP_SUMMARY"; date -u +"end   %FT%TZ"' EXIT
          cargo build --locked --profile ci --bin last_route --features server
          # last_route is built on the line above; list every other bin of Cargo.toml and src/bin/ here
          cargo check --locked --profile ci --features server --bin lr_server --bin lr_story_server --bin lr_story --bin night_watch

      # Exit 0 pass, 1 fail, 2 nothing ran. The JSON report is kept as an artifact.
      - name: Headless test suites
        if: matrix.part == 'suites'
        run: ./target/ci/last_route${{ runner.os == 'Windows' && '.exe' || '' }} --test-suite "tests/*.json" --out target/test-reports/suite-report.json

      # The self-test is not run here: it needs a real OpenGL context and an audio device, which
      # hosted runners do not have (Windows fails on the pixel format and hangs). Run it locally.

      - uses: actions/upload-artifact@v6
        if: always() && matrix.part == 'suites'
        continue-on-error: true
        with:
          name: test-reports-${{ matrix.os }}
          path: target/test-reports/
          retention-days: 3
          if-no-files-found: warn
