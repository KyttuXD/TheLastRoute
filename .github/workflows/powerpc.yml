# Experimental big-endian PowerPC Linux build (G3/G4/G5 Macs and POWER machines under Linux): docs/POWERPC.md.
# Manual only (Actions > powerpc > Run workflow), so it adds no check to pushes and pull requests.
# Each job publishes its UNTESTED program to the rolling "nightly-legacy" pre-release (run from main only), next to
# the 10.6 app of macos-legacy.yml, for a real PowerPC machine to try: it has run its headless suites in the qemu
# user emulator here, never on PowerPC hardware and never with a window.
name: powerpc
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_BUILD_JOBS: "4"
  NIGHTLY_TAG: nightly-legacy
  NIGHTLY_TITLE: Nightly legacy (OS X 10.5 to 10.11 Intel, PowerPC Linux)
  NIGHTLY_NOTES: "Experimental builds for old machines, built by hand from the Actions tab (workflows macos-legacy and powerpc). last_route-macos-legacy.zip is one app for 64-bit Intel Macs on OS X 10.5 to 10.11: it starts, draws and plays a stress run on a 2008 Mac Pro (3,1) under OS X 10.6.8, and has not been tried on other Macs or systems. The powerpc files are for PowerPC machines running Linux (big-endian, glibc 2.35 or newer) and are UNTESTED on real hardware; there is no build for Mac OS X on PowerPC (docs/MACOS_SNOW_LEOPARD.md, docs/POWERPC.md). The files are replaced in place on each run."

jobs:
  build:
    name: build (${{ matrix.bits }}-bit)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - bits: "64"
            triple: powerpc64-unknown-linux-gnu
            gcc: gcc-powerpc64-linux-gnu
            strip: powerpc64-linux-gnu-strip
          - bits: "32"
            triple: powerpc-unknown-linux-gnu
            gcc: gcc-powerpc-linux-gnu
            strip: powerpc-linux-gnu-strip
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: powerpc-${{ matrix.bits }}
      - run: sudo apt-get install -y ${{ matrix.gcc }} qemu-user || (sudo apt-get update && sudo apt-get install -y ${{ matrix.gcc }} qemu-user)
      - name: Build, then the headless suites under qemu
        run: sh packaging/powerpc/build.sh ${{ matrix.bits }} suites
      - name: Collect the program
        run: |
          mkdir -p dist
          cp target/${{ matrix.triple }}/ci/last_route dist/last_route-linux-powerpc${{ matrix.bits }}-UNTESTED
          ${{ matrix.strip }} dist/last_route-linux-powerpc${{ matrix.bits }}-UNTESTED
          tar -C dist -czf dist/last_route-linux-powerpc${{ matrix.bits }}-UNTESTED.tar.gz last_route-linux-powerpc${{ matrix.bits }}-UNTESTED
      - uses: actions/upload-artifact@v6
        with:
          name: last_route-linux-powerpc${{ matrix.bits }}-UNTESTED
          path: dist/last_route-linux-powerpc${{ matrix.bits }}-UNTESTED
          retention-days: 3
          if-no-files-found: error
      - name: Publish to nightly-legacy
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh packaging/nightly.sh dist/last_route-linux-powerpc${{ matrix.bits }}-UNTESTED.tar.gz
