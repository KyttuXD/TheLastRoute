<!-- macroquad/miniquad JavaScript runtime, then the quad-snd audio plugin, then the game -->

<script>
// Pointer lock state for the game's mouse look (app/web_pointer.rs): true only when the canvas really holds the pointer.
// Browser storage for the settings (app/web_storage.rs): localStorage by key, as text. The wasm passes its bytes by
// pointer into its own memory; a blocked or missing storage answers "nothing stored" and never throws into the game.
const lrDecoder = new TextDecoder();
const lrEncoder = new TextEncoder();
function lrText(ptr, len) {
  return lrDecoder.decode(new Uint8Array(wasm_memory.buffer, ptr, len));
}
miniquad_add_plugin({
  register_plugin: function (importObject) {
    importObject.env.lr_pointer_locked = function () {
      return document.pointerLockElement === document.getElementById("glcanvas") ? 1 : 0;
    };
    // -1 when nothing is stored; the byte length otherwise, copied only when it fits in cap (the game then reads it again)
    importObject.env.lr_storage_get = function (keyPtr, keyLen, dstPtr, cap) {
      try {
        const value = window.localStorage.getItem(lrText(keyPtr, keyLen));
        if (value === null) return -1;
        const bytes = lrEncoder.encode(value);
        if (bytes.length <= cap) new Uint8Array(wasm_memory.buffer, dstPtr, bytes.length).set(bytes);
        return bytes.length;
      } catch (e) {
        return -1;
      }
    };
    importObject.env.lr_storage_set = function (keyPtr, keyLen, valPtr, valLen) {
      try {
        window.localStorage.setItem(lrText(keyPtr, keyLen), lrText(valPtr, valLen));
        return 1;
      } catch (e) {
        return 0;
      }
    };
  },
  version: 1,
  name: "lr_pointer",
});
</script>
<script>
// The room relay and the directory (net/web_bridge.rs), registered as the lr_net plugin. The relay is the backend's
// WebSocket at /api/ws (the Godot web build's relay: the same text control frames and binary frames). The directory calls
// are synchronous XMLHttpRequests, so the wasm gets each answer in one call. Handles and result ids are small integers
// owned by this page; the wasm releases them. The API origin is window.LR_API_BASE when the page sets it, else the page's
// own origin (so a site that serves /api itself needs nothing more).
(function () {
  const sockets = new Map();
  const results = new Map();
  let nextSocket = 1;
  let nextResult = 1;
  const decoder = new TextDecoder();
  const encoder = new TextEncoder();

  function view(ptr, len) {
    return new Uint8Array(wasm_memory.buffer, ptr, len);
  }
  function text(ptr, len) {
    return decoder.decode(view(ptr, len));
  }
  // copies the bytes when they fit; the length is returned either way (the wasm reads again with a bigger buffer)
  function copyOut(bytes, dst, cap) {
    if (bytes.length <= cap) view(dst, bytes.length).set(bytes);
    return bytes.length;
  }
  function apiBase() {
    try {
      return String(window.LR_API_BASE || window.location.origin).replace(/\/+$/, "");
    } catch (e) {
      return "";
    }
  }

  // ---- WebSocket: one socket per room connection ----
  function wsOpen(url, hello) {
    let ws;
    try {
      ws = new WebSocket(url);
    } catch (e) {
      return 0;
    }
    ws.binaryType = "arraybuffer";
    const id = nextSocket++;
    const entry = { ws: ws, queue: [] };
    sockets.set(id, entry);
    ws.onopen = function () {
      try {
        ws.send(hello);
      } catch (e) {}
    };
    ws.onmessage = function (event) {
      if (typeof event.data === "string") entry.queue.push({ kind: 1, bytes: encoder.encode(event.data) });
      else entry.queue.push({ kind: 2, bytes: new Uint8Array(event.data) });
    };
    // a failed connection closes too (code 1006), so the close is always the last queued item
    ws.onclose = function (event) {
      entry.queue.push({ kind: 3, bytes: encoder.encode(event.code + "\n" + (event.reason || "")) });
    };
    return id;
  }
  function wsPeekKind(id) {
    const e = sockets.get(id);
    return e && e.queue.length ? e.queue[0].kind : 0;
  }
  function wsPeekLen(id) {
    const e = sockets.get(id);
    return e && e.queue.length ? e.queue[0].bytes.length : 0;
  }
  function wsPop(id, dst, cap) {
    const e = sockets.get(id);
    if (!e || !e.queue.length) return -1;
    const item = e.queue[0];
    if (item.bytes.length > cap) return -1;
    e.queue.shift();
    view(dst, item.bytes.length).set(item.bytes);
    // a closed socket is forgotten once its close has been read
    if (item.kind === 3) sockets.delete(id);
    return item.bytes.length;
  }
  function wsSend(id, ptr, len, asText) {
    const e = sockets.get(id);
    if (!e || e.ws.readyState !== 1) return 0;
    try {
      e.ws.send(asText ? text(ptr, len) : view(ptr, len).slice());
      return 1;
    } catch (err) {
      return 0;
    }
  }
  function wsBuffered(id) {
    const e = sockets.get(id);
    return e ? Math.min(e.ws.bufferedAmount, 2147483647) : 0;
  }
  function wsClose(id, code, reason) {
    const e = sockets.get(id);
    if (!e) return;
    try {
      e.ws.close(code, reason);
    } catch (err) {}
  }

  // ---- HTTP: a synchronous request; the answer is kept until the wasm frees it ----
  function httpSend(methodPtr, methodLen, urlPtr, urlLen, headersPtr, headersLen, bodyPtr, bodyLen, hasBody) {
    const id = nextResult++;
    const result = { status: 0, headers: new Uint8Array(0), body: new Uint8Array(0) };
    results.set(id, result);
    try {
      let url = text(urlPtr, urlLen);
      // a path names the page's API origin
      if (url.charAt(0) === "/") url = apiBase() + url;
      const xhr = new XMLHttpRequest();
      xhr.open(text(methodPtr, methodLen), url, false);
      // raw bytes both ways: the answer is read one byte per character, so a binary body survives
      xhr.overrideMimeType("text/plain; charset=x-user-defined");
      for (const line of text(headersPtr, headersLen).split("\n")) {
        const colon = line.indexOf(":");
        if (colon <= 0) continue;
        try {
          xhr.setRequestHeader(line.slice(0, colon).trim(), line.slice(colon + 1).trim());
        } catch (e) {}
      }
      xhr.send(hasBody ? view(bodyPtr, bodyLen).slice() : null);
      result.status = xhr.status;
      result.headers = encoder.encode(xhr.getAllResponseHeaders());
      const raw = xhr.responseText;
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i) & 0xff;
      result.body = bytes;
    } catch (e) {
      // no answer: the status stays 0, which the wasm reports as "the request did not reach the server"
      result.status = 0;
    }
    return id;
  }

  miniquad_add_plugin({
    register_plugin: function (importObject) {
      const env = importObject.env;
      env.lr_api_base = function (dst, cap) {
        return copyOut(encoder.encode(apiBase()), dst, cap);
      };
      env.lr_ws_open = function (urlPtr, urlLen, helloPtr, helloLen) {
        return wsOpen(text(urlPtr, urlLen), text(helloPtr, helloLen));
      };
      env.lr_ws_peek_kind = wsPeekKind;
      env.lr_ws_peek_len = wsPeekLen;
      env.lr_ws_pop = wsPop;
      env.lr_ws_send = wsSend;
      env.lr_ws_buffered = wsBuffered;
      env.lr_ws_close = function (id, code, reasonPtr, reasonLen) {
        wsClose(id, code, text(reasonPtr, reasonLen));
      };
      env.lr_http_send = httpSend;
      env.lr_http_status = function (id) {
        const r = results.get(id);
        return r ? r.status : 0;
      };
      env.lr_http_headers = function (id, dst, cap) {
        const r = results.get(id);
        return r ? copyOut(r.headers, dst, cap) : -1;
      };
      env.lr_http_body = function (id, dst, cap) {
        const r = results.get(id);
        return r ? copyOut(r.body, dst, cap) : -1;
      };
      env.lr_http_free = function (id) {
        results.delete(id);
      };
    },
    version: 1,
    name: "lr_net",
  });
})();
</script>
<script>
// The file chooser (shared/file_pick.rs), registered as the lr_pick plugin. It is generic, so anything in the game (the
// SKIN tab's PICK A PNG, a mod's import) can use it:
//   lr_pick_open(kind, multiple, directory) -> request id (0 when the page could not make one). `kind` is an HTML accept
//     string ("image/png,.png"); `directory` chooses a folder (its files, named by their path inside it).
//   lr_pick_state(id) -> 0 pending, 1 done, 2 cancelled (also an unknown id)
//   lr_pick_count(id), lr_pick_name(id, i, dst, cap), lr_pick_size(id, i)
//   lr_pick_read(id, i, dst, cap) -> byte length, -1 when the bytes are not there; copied only when they fit in cap
//   lr_pick_release(id) forgets the request and its bytes
// The chosen files are read into the page when the player confirms; their bytes stay here until lr_pick_read copies one
// into the wasm, so the game never holds a file it did not ask for. Nothing here throws into the game.
(function () {
  const requests = new Map();
  let nextRequest = 1;
  const encoder = new TextEncoder();
  const decoder = new TextDecoder();
  // a file bigger than this is not loaded into the page at all (the game refuses such sizes from lr_pick_size)
  const MAX_LOAD = 64 * 1024 * 1024;

  function view(ptr, len) {
    return new Uint8Array(wasm_memory.buffer, ptr, len);
  }
  function copyOut(bytes, dst, cap) {
    if (bytes.length <= cap) view(dst, bytes.length).set(bytes);
    return bytes.length;
  }
  function loadFile(file) {
    const entry = { name: file.webkitRelativePath || file.name, size: file.size, bytes: null };
    if (file.size > MAX_LOAD) return Promise.resolve(entry);
    return file.arrayBuffer().then(
      function (buffer) {
        entry.bytes = new Uint8Array(buffer);
        return entry;
      },
      function () {
        return entry;
      }
    );
  }
  function forget(req) {
    try {
      if (req.input && req.input.parentNode) req.input.parentNode.removeChild(req.input);
    } catch (e) {}
    for (const off of req.undo) {
      try {
        off();
      } catch (e) {}
    }
    req.undo = [];
  }

  function open(kind, multiple, directory) {
    try {
      const input = document.createElement("input");
      input.type = "file";
      if (kind) input.accept = kind;
      input.multiple = !!multiple;
      if (directory) input.webkitdirectory = true;
      input.style.cssText = "position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;pointer-events:none";
      const id = nextRequest++;
      const req = { state: 0, input: input, files: [], undo: [] };
      requests.set(id, req);
      const cancel = function () {
        if (req.state === 0) req.state = 2;
        forget(req);
      };
      input.addEventListener("change", function () {
        if (req.state !== 0 || requests.get(id) !== req) return forget(req);
        const list = Array.prototype.slice.call(input.files || []);
        if (list.length === 0) return cancel();
        Promise.all(list.map(loadFile)).then(
          function (files) {
            if (req.state !== 0 || requests.get(id) !== req) return;
            req.files = files;
            req.state = 1;
            forget(req);
          },
          cancel
        );
      });
      if ("oncancel" in input) {
        input.addEventListener("cancel", cancel);
      } else {
        // older browsers say nothing when the window is closed: the page getting focus back with no file after a moment is a cancel
        const onFocus = function () {
          setTimeout(function () {
            if (req.state === 0 && !(input.files && input.files.length)) cancel();
          }, 1000);
        };
        window.addEventListener("focus", onFocus, { once: true });
        req.undo.push(function () {
          window.removeEventListener("focus", onFocus);
        });
      }
      document.body.appendChild(input);
      // a chooser may only open on a user gesture; when the browser says the click that asked is no longer one, the next
      // click or key press opens it instead
      const active = !(window.navigator.userActivation && window.navigator.userActivation.isActive === false);
      if (active) {
        input.click();
      } else {
        const later = function () {
          try {
            if (req.state === 0 && requests.get(id) === req) input.click();
          } catch (e) {}
          for (const name of ["pointerdown", "keydown"]) window.removeEventListener(name, later, true);
        };
        for (const name of ["pointerdown", "keydown"]) window.addEventListener(name, later, true);
        req.undo.push(function () {
          for (const name of ["pointerdown", "keydown"]) window.removeEventListener(name, later, true);
        });
      }
      return id;
    } catch (e) {
      return 0;
    }
  }

  function guard(fallback, fn) {
    return function () {
      try {
        return fn.apply(null, arguments);
      } catch (e) {
        return fallback;
      }
    };
  }

  miniquad_add_plugin({
    register_plugin: function (importObject) {
      const env = importObject.env;
      env.lr_pick_open = guard(0, function (kindPtr, kindLen, multiple, directory) {
        return open(decoder.decode(view(kindPtr, kindLen)), multiple !== 0, directory !== 0);
      });
      env.lr_pick_state = guard(2, function (id) {
        const r = requests.get(id);
        return r ? r.state : 2;
      });
      env.lr_pick_count = guard(0, function (id) {
        const r = requests.get(id);
        return r && r.state === 1 ? r.files.length : 0;
      });
      env.lr_pick_name = guard(-1, function (id, i, dst, cap) {
        const r = requests.get(id);
        const f = r && r.state === 1 ? r.files[i] : null;
        return f ? copyOut(encoder.encode(f.name), dst, cap) : -1;
      });
      env.lr_pick_size = guard(-1, function (id, i) {
        const r = requests.get(id);
        const f = r && r.state === 1 ? r.files[i] : null;
        return f ? Math.min(f.size, 2147483647) : -1;
      });
      env.lr_pick_read = guard(-1, function (id, i, dst, cap) {
        const r = requests.get(id);
        const f = r && r.state === 1 ? r.files[i] : null;
        return f && f.bytes ? copyOut(f.bytes, dst, cap) : -1;
      });
      env.lr_pick_release = guard(0, function (id) {
        const r = requests.get(id);
        if (r) {
          r.state = r.state === 0 ? 2 : r.state;
          forget(r);
          requests.delete(id);
        }
        return 0;
      });
    },
    version: 1,
    name: "lr_pick",
  });
})();
</script>
<script>
// Imported mod packs (content/pack_import.rs), registered as the lr_mods plugin. The MODS tab's IMPORT FOLDER / IMPORT .ZIP
// hand the game's checked packs here as one byte string each (the game's own encoding; this page never looks inside), and
// they are kept in IndexedDB (database "last_route_mods", store "packs", key = the pack id, value = the bytes). IndexedDB is
// asynchronous and the game reads synchronously, so every stored pack is read into memory BEFORE the wasm starts
// (window.lrModsReady, awaited by the load line below, with a 4 second limit so a stuck database never blocks the game). From
// then on the game reads from that memory and writes through to IndexedDB in the background.
//   lr_mods_count() -> packs read at page start
//   lr_mods_id(i, dst, cap) -> id length (copied only when it fits) ; lr_mods_size(i) -> bytes, -1 if absent
//   lr_mods_read(i, dst, cap) -> bytes length, -1 if absent (copied only when it fits)
//   lr_mods_put(idPtr, idLen, dataPtr, dataLen) -> 1 queued, 0 refused (no storage) ; lr_mods_remove(idPtr, idLen) -> 1 / 0
//   lr_mods_state() -> 0 no storage (nothing survives a reload), 1 works, 2 the last save failed (quota, usually)
// The size limit is the game's (256 MB of imported mods in all, 16 MB a file, 128 MB a pack); the browser's own IndexedDB
// quota can be smaller, and then state turns 2 and the tab says the save failed. localStorage is not used: it holds about
// 5 MB of text, far less than a model pack.
(function () {
  const DB_NAME = "last_route_mods";
  const STORE = "packs";
  const memory = new Map(); // pack id -> Uint8Array (what the game saw at start, then what it saved or removed)
  let order = []; // the ids in the order the game indexes them at start
  let db = null;
  let state = 0;
  let started = false; // the game has begun reading: late results from IndexedDB are ignored
  const decoder = new TextDecoder();
  const encoder = new TextEncoder();

  function view(ptr, len) {
    return new Uint8Array(wasm_memory.buffer, ptr, len);
  }
  function copyOut(bytes, dst, cap) {
    if (bytes.length <= cap) view(dst, bytes.length).set(bytes);
    return bytes.length;
  }
  function openDb() {
    return new Promise(function (resolve, reject) {
      const req = window.indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        req.result.createObjectStore(STORE);
      };
      req.onsuccess = function () {
        resolve(req.result);
      };
      req.onerror = function () {
        reject(req.error);
      };
      req.onblocked = function () {
        reject(new Error("blocked"));
      };
    });
  }
  function readAll(database) {
    return new Promise(function (resolve, reject) {
      const store = database.transaction(STORE, "readonly").objectStore(STORE);
      const keys = store.getAllKeys();
      const values = store.getAll();
      store.transaction.oncomplete = function () {
        resolve({ keys: keys.result, values: values.result });
      };
      store.transaction.onerror = function () {
        reject(store.transaction.error);
      };
      store.transaction.onabort = function () {
        reject(store.transaction.error);
      };
    });
  }
  function write(change) {
    if (!db) return false;
    try {
      const tx = db.transaction(STORE, "readwrite");
      change(tx.objectStore(STORE));
      tx.oncomplete = function () {
        if (state === 2) state = 1;
      };
      tx.onerror = tx.onabort = function () {
        state = 2;
      };
      return true;
    } catch (e) {
      state = 2;
      return false;
    }
  }

  const loading = (async function () {
    if (!window.indexedDB) return;
    const database = await openDb();
    const found = await readAll(database);
    if (started) return;
    db = database;
    state = 1;
    for (let i = 0; i < found.keys.length; i++) {
      const value = found.values[i];
      const bytes = value instanceof Uint8Array ? value : value ? new Uint8Array(value) : null;
      if (typeof found.keys[i] === "string" && bytes) memory.set(found.keys[i], bytes);
    }
  })().catch(function () {
    // no usable IndexedDB (a private window, storage blocked): the game runs without kept mods
    db = null;
    state = 0;
  });
  window.lrModsReady = Promise.race([
    loading,
    new Promise(function (resolve) {
      setTimeout(resolve, 4000);
    }),
  ]).then(function () {
    started = true;
    order = Array.from(memory.keys());
    if (!db) state = 0;
  });

  function guard(fallback, fn) {
    return function () {
      try {
        return fn.apply(null, arguments);
      } catch (e) {
        return fallback;
      }
    };
  }

  miniquad_add_plugin({
    register_plugin: function (importObject) {
      const env = importObject.env;
      env.lr_mods_count = guard(0, function () {
        return order.length;
      });
      env.lr_mods_id = guard(-1, function (i, dst, cap) {
        return i < order.length ? copyOut(encoder.encode(order[i]), dst, cap) : -1;
      });
      env.lr_mods_size = guard(-1, function (i) {
        const bytes = i < order.length ? memory.get(order[i]) : null;
        return bytes ? bytes.length : -1;
      });
      env.lr_mods_read = guard(-1, function (i, dst, cap) {
        const bytes = i < order.length ? memory.get(order[i]) : null;
        return bytes ? copyOut(bytes, dst, cap) : -1;
      });
      env.lr_mods_put = guard(0, function (idPtr, idLen, dataPtr, dataLen) {
        if (state === 0 || !db) return 0;
        const id = decoder.decode(view(idPtr, idLen));
        // a copy: the wasm memory can grow (and move) after this call returns
        const bytes = new Uint8Array(view(dataPtr, dataLen));
        memory.set(id, bytes);
        return write(function (store) {
          store.put(bytes, id);
        })
          ? 1
          : 0;
      });
      env.lr_mods_remove = guard(0, function (idPtr, idLen) {
        const id = decoder.decode(view(idPtr, idLen));
        memory.delete(id);
        if (state === 0 || !db) return 0;
        return write(function (store) {
          store.delete(id);
        })
          ? 1
          : 0;
      });
      env.lr_mods_state = guard(0, function () {
        return state;
      });
    },
    version: 1,
    name: "lr_mods",
  });
})();
</script>
<script>
// The clipboard for the game's text fields (ui/clipboard.rs), registered as the lr_clip plugin. miniquad's own clipboard
// code cannot serve them (it keeps the last paste for ever, answers a copy event with text from a frame ago, and never
// reaches the real clipboard from a button), so this page does the three jobs itself:
//   lr_paste_take(dst, cap) -> -1 nothing pending; else the byte length of the text of the last paste (the browser's
//     `paste` event, or navigator.clipboard.readText() when no event came after the paste key). The text is handed over
//     once and only while fresh (3 seconds), so an old paste never lands in a field opened later. Copied only when it
//     fits in cap (it then stays pending and the game reads again with a bigger buffer).
//   lr_clip_offer(ptr, len) -> what Ctrl/Cmd+C or +X would copy right now. The game repeats it every frame while a text
//     field is focused; an offer older than half a second is ignored. An empty offer means "copy nothing" (a password
//     field). The browser's `copy` / `cut` event is answered from it inside the event, which works in every browser
//     without a permission prompt.
//   lr_clip_write(ptr, len) -> puts text on the clipboard (the COPY CODE button, a copy shortcut). navigator.clipboard
//     where the browser allows it; if not, the text waits for the next key or pointer gesture and goes out then (Safari
//     only allows a write inside one), by navigator.clipboard again or the hidden-textarea copy command.
// Nothing here throws into the game.
(function () {
  const decoder = new TextDecoder();
  const encoder = new TextEncoder();
  const PASTE_FRESH_MS = 3000;
  const OFFER_FRESH_MS = 500;
  const MAX_PASTE = 4096; // characters kept of a paste; the fields are far shorter
  let paste = null; // { text: Uint8Array, at: ms }
  let pasteSeen = 0; // when a paste event last arrived
  let offer = null; // { text: string, at: ms }
  let waiting = null; // { text, at }: text the browser refused to write outside a gesture, kept for WAIT_MS
  const WAIT_MS = 15000;

  function now() {
    return window.performance && performance.now ? performance.now() : Date.now();
  }
  function view(ptr, len) {
    return new Uint8Array(wasm_memory.buffer, ptr, len);
  }
  function keepPaste(text) {
    if (typeof text !== "string" || text.length === 0) return;
    paste = { text: encoder.encode(text.slice(0, MAX_PASTE)), at: now() };
  }

  // ---- paste ----
  // capture phase: runs before miniquad's own listener, which stops the event
  window.addEventListener(
    "paste",
    function (e) {
      pasteSeen = now();
      try {
        const data = e.clipboardData || window.clipboardData;
        keepPaste(data ? data.getData("text/plain") || data.getData("Text") : "");
      } catch (err) {}
    },
    true
  );
  // A paste key the browser never answered with a paste event (a page without an editable focus can make some browsers
  // skip it): ask for the clipboard instead. Browsers show their own permission or "Paste" prompt for this.
  window.addEventListener(
    "keydown",
    function (e) {
      if (e.repeat) return;
      const mod = e.ctrlKey || e.metaKey;
      const wantsPaste = (mod && e.code === "KeyV") || (e.shiftKey && !mod && e.code === "Insert");
      if (!wantsPaste) return;
      const pressedAt = now();
      setTimeout(function () {
        if (pasteSeen >= pressedAt) return;
        // only while a text field is focused (the game offers its text every frame then): a Ctrl+V pressed anywhere else
        // must not make the browser ask for the clipboard
        if (!offer || now() - offer.at > OFFER_FRESH_MS) return;
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            navigator.clipboard.readText().then(keepPaste, function () {});
          }
        } catch (err) {}
      }, 120);
    },
    true
  );

  // ---- copy and cut ----
  function answerCopy(e) {
    if (!offer || now() - offer.at > OFFER_FRESH_MS) return; // no text field is focused: leave it to the page
    try {
      if (offer.text.length > 0) {
        e.clipboardData.setData("text/plain", offer.text);
      }
      e.preventDefault();
      // miniquad's own listeners would put a stored text from a frame ago on the clipboard
      e.stopImmediatePropagation();
    } catch (err) {}
  }
  window.addEventListener("copy", answerCopy, true);
  window.addEventListener("cut", answerCopy, true);

  // ---- writing from the game ----
  function execCopy(text) {
    const active = document.activeElement;
    try {
      const box = document.createElement("textarea");
      box.value = text;
      box.setAttribute("readonly", "");
      box.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
      document.body.appendChild(box);
      box.select();
      box.setSelectionRange(0, text.length);
      const ok = document.execCommand("copy");
      document.body.removeChild(box);
      return ok;
    } catch (err) {
      return false;
    } finally {
      try {
        (active && active.focus ? active : document.getElementById("glcanvas")).focus();
      } catch (err) {}
    }
  }
  function write(text, inGesture) {
    let started = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        started = true;
        navigator.clipboard.writeText(text).then(
          function () {
            if (waiting && waiting.text === text) waiting = null;
          },
          function () {
            if (inGesture) execCopy(text);
            else waiting = { text: text, at: now() };
          }
        );
      }
    } catch (err) {
      started = false;
    }
    if (!started) {
      if (inGesture && execCopy(text)) return;
      waiting = { text: text, at: now() };
    }
  }
  function flushWaiting() {
    if (waiting === null) return;
    const held = waiting;
    waiting = null;
    // a text kept for long is not what the player means to have on the clipboard any more
    if (now() - held.at <= WAIT_MS) write(held.text, true);
  }
  for (const name of ["pointerup", "mouseup", "touchend", "keyup", "keydown"]) {
    window.addEventListener(name, flushWaiting, true);
  }
  // Ctrl/Cmd+A on the canvas would select the page (a blue wash over the game in some browsers); the game still gets the key
  window.addEventListener(
    "keydown",
    function (e) {
      if ((e.ctrlKey || e.metaKey) && e.code === "KeyA" && e.target && e.target.id === "glcanvas") e.preventDefault();
    },
    true
  );

  function guard(fallback, fn) {
    return function () {
      try {
        return fn.apply(null, arguments);
      } catch (err) {
        return fallback;
      }
    };
  }
  miniquad_add_plugin({
    register_plugin: function (importObject) {
      const env = importObject.env;
      env.lr_paste_take = guard(-1, function (dst, cap) {
        if (!paste) return -1;
        if (now() - paste.at > PASTE_FRESH_MS) {
          paste = null;
          return -1;
        }
        const bytes = paste.text;
        if (bytes.length > cap) return bytes.length;
        view(dst, bytes.length).set(bytes);
        paste = null;
        return bytes.length;
      });
      env.lr_clip_offer = guard(0, function (ptr, len) {
        offer = { text: decoder.decode(view(ptr, len)), at: now() };
        return 0;
      });
      env.lr_clip_write = guard(0, function (ptr, len) {
        write(decoder.decode(view(ptr, len)), false);
        return 0;
      });
    },
    version: 1,
    name: "lr_clip",
  });
})();
</script>
<script>(window.lrModsReady || Promise.resolve()).then(function () { load("last_route.wasm"); });</script>
