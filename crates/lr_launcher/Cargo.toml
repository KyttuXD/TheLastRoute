[package]
name = "lr_launcher"
version = "0.1.0"
edition = "2021"
description = "The Last Route launcher: installs the newest signed native build from the website, runs it, falls back to the web version."

[lib]
name = "lr_launcher"
path = "src/lib.rs"

[[bin]]
name = "lr_launcher"
path = "src/main.rs"

# A stand-in for the game used by the tests (behaviour comes from data/behavior.txt next to it). Tiny; not shipped.
[[bin]]
name = "lr_stub_game"
path = "src/bin/lr_stub_game.rs"
test = false

[dependencies]
serde_json = "1"
lr_update = { path = "../lr_update" }

[dev-dependencies]
lr_update = { path = "../lr_update", features = ["testsite"] }

ring = "0.17"
