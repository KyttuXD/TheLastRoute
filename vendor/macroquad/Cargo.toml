# macroquad 0.4.16 from crates.io with Last Route patches (LAST_ROUTE_PATCHES.md). Examples, tests and the js
# folder are left out; the dependency table is the crate's own.
[package]
name = "macroquad"
version = "0.4.16"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Simple and easy to use graphics library"

[lib]
name = "macroquad"
path = "src/lib.rs"

[features]
audio = ["quad-snd"]
default = []

[dependencies]
fontdue = "0.9"
glam = { version = "0.27", features = ["scalar-math"] }
miniz_oxide = "0.8"
miniquad = { version = "=0.4.11", features = ["log-impl"] }
quad-rand = "0.2.3"
quad-snd = { version = "0.2", optional = true }
