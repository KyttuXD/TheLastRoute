[package]
name = "last_route"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde_json = "1"
gltf = { version = "1", default-features = false, features = ["utils"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

# Ship the Windows build without a companion debug database or symbol table. Native
# binaries can never be made impossible to inspect, but release artifacts should not
# include the development metadata that made the previous debug build easy to reverse.
[profile.release]
debug = 0
strip = "symbols"
panic = "abort"

[patch.crates-io]
quad-snd = { path = "src/audio/quad-snd" }
