[package]
name = "last_route"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# The launcher crates (crates/): a tiny native launcher that installs the game from the website (docs/LAUNCHER.md).
# They do not depend on macroquad, so building them never compiles the game. The game itself depends on lr_update
# (native only) for the same manifest and signature checks. `cargo test` at the root still runs only the game package.
[workspace]
members = [".", "crates/*"]
resolver = "2"

# The shared core (src/lib.rs). The game and the other executables live in src/bin/<name>/.
[lib]
name = "last_route_core"
path = "src/lib.rs"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
# preserve_order keeps object keys in insertion order, like JSON.stringify in Node (lr_server needs it).
serde_json = { version = "1", features = ["preserve_order"] }
# lr_server's dependencies. They build only with the `server` feature, so the game
# do not compile them (cargo build --features server --bin lr_server).
indexmap = { version = "2", optional = true }
socket2 = { version = "0.5", optional = true }
sha2 = "0.10"
# Bounded zlib inflate for the skin PNG check (already in the tree through macroquad, image and png).
miniz_oxide = "0.8"
hmac = { version = "0.12", optional = true }
scrypt = { version = "0.11", default-features = false, optional = true }
getrandom = { version = "0.2", optional = true }
regex = { version = "1", optional = true }
tiny_http = { version = "0.12", optional = true }

# HTTPS for the native game (net/http.rs). The browser (wasm32) build has no TLS: rustls and ring need a C
# compiler and do not target wasm, so they are only pulled in for native targets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lr_update = { path = "crates/lr_update" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# The system file dialog behind the SKIN tab's PICK A PNG (shared/file_pick.rs): the Windows and macOS open panels only.
# Linux asks zenity or kdialog itself (which is all rfd did there), the browser build has its own chooser in the page,
# and the legacy Mac build calls AppKit's panel directly.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# LR Story's browser saves (src/bin/lr_story/save.rs): the page's localStorage through quad-storage. Native saves use a file.
[target.'cfg(target_arch = "wasm32")'.dependencies]
quad-storage = "0.1.3"

# The fake website the in-game updater's tests talk to (loopback only; never in a normal build).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
lr_update = { path = "crates/lr_update", features = ["testsite"] }

[features]
default = []
server = [
    "dep:indexmap",
    "dep:socket2",
    "dep:hmac",
    "dep:scrypt",
    "dep:getrandom",
    "dep:regex",
    "dep:tiny_http",
]

[[bin]]
name = "lr_server"
path = "src/bin/lr_server/main.rs"
required-features = ["server"]

[[bin]]
name = "lr_story_server"
path = "src/bin/lr_story_server/main.rs"
required-features = ["server"]

# The Windows icon step in build.rs (#[cfg(windows)], so the build host). Other hosts never download or compile it
# or its toml crates.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 2
# Line tables only: backtraces keep file and line, but the compiler skips full debug info for the ~190k-line game crate,
# which was a large share of every dev and test build (and of the disk under target/).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

# Ship the Windows build without a companion debug database or symbol table. Native
# binaries can never be made impossible to inspect, but release artifacts should not
# include the development metadata that made the previous debug build easy to reverse.
[profile.release]
debug = 0
strip = "symbols"
panic = "abort"
# One codegen unit and fat LTO let the optimiser see the whole program: smaller and faster code, which matters most in the
# browser build (single-threaded wasm, bound by CPU rather than the GPU). The cost is a slower release link: a native release
# build and the wasm build each take longer than with the default 16 units, so day-to-day work uses the dev, fast and ci profiles.
# opt-level stays at the default 3: -Os and -Oz would shrink only the code section (a fifth of the wasm, the rest is embedded
# assets) and cost speed. Cargo has no per-target profile, so these settings apply to every release target, native included.
lto = "fat"
# 16 units, not 1 (2026-11-12): fat LTO still optimises the whole program as one, so the game runs the same (stress
# run, four runs each way: 0.862 ms a frame with 16, 0.866 ms with 1), and the build before the LTO step runs on every
# core: 72 s against 122 s here with the dependencies built. Thin LTO was faster still but 5% slower to play
# (docs/COMPILE_SPEED.md).
codegen-units = 16

# CI builds (cargo build --profile ci) keep the dev settings and line tables for backtraces, without full debug info.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"

# Fast local iteration (cargo build --profile fast): cheaper than dev, still debuggable.
[profile.fast]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.fast.package."*"]
opt-level = 2

# The Android app (cargo quad-apk, packaging/android/build-apk.sh; docs/ANDROID.md). The package name must end in the
# cargo target name (last_route): the tool names the Java library after its last segment. The activity needs `exported`
# for target API 31 and up.
[package.metadata.android]
android_version = 36
target_sdk_version = 36
min_sdk_version = 26
build_targets = ["aarch64-linux-android"]
package_name = "org.kyttuslab.last_route"
label = "The Last Route"
version_code = 1
fullscreen = true
opengles_version_major = 3
opengles_version_minor = 0

[package.metadata.android.activity_attributes]
"android:screenOrientation" = "sensorLandscape"
"android:exported" = "true"

[[package.metadata.android.permission]]
name = "android.permission.INTERNET"

[patch.crates-io]
quad-snd = { path = "src/bin/last_route/audio/quad-snd" }
# miniquad 0.4.11 with Metal fixes and a live frame-pacer switch (vendor/miniquad/LAST_ROUTE_PATCHES.md).
miniquad = { path = "vendor/miniquad" }
# macroquad 0.4.16 with a smaller glyph atlas (vendor/macroquad/LAST_ROUTE_PATCHES.md).
macroquad = { path = "vendor/macroquad" }
# quad-rand 0.2.3 without its 64-bit atomic, so 32-bit PowerPC builds (vendor/quad-rand/LAST_ROUTE_PATCHES.md).
quad-rand = { path = "vendor/quad-rand" }
