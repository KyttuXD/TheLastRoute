[package]
name = "last_route"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# The shared core (src/lib.rs). The game and the other executables live in src/bin/<name>/.
[lib]
name = "last_route_core"
path = "src/lib.rs"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
gltf = { version = "1", default-features = false, features = ["utils"] }
# preserve_order keeps object keys in insertion order, like JSON.stringify in Node (lr_server needs it).
serde_json = { version = "1", features = ["preserve_order"] }
# lr_server (src/bin/lr_server) dependencies; the game binary does not use them.
serde = "1"
indexmap = "2"
socket2 = "0.5"
sha2 = "0.10"
sha1_smol = "1"
hmac = "0.12"
scrypt = { version = "0.11", default-features = false }
getrandom = "0.2"
regex = "1"
tiny_http = "0.12"

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

# Ship the Windows build without a companion debug database or symbol table. Native
# binaries can never be made impossible to inspect, but release artifacts should not
# include the development metadata that made the previous debug build easy to reverse.
[profile.release]
debug = 0
strip = "symbols"
panic = "abort"

[patch.crates-io]
quad-snd = { path = "src/audio/quad-snd" }
