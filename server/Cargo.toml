[package]
name = "lr_server"
version = "0.2.0"
edition = "2021"
description = "Rust port of the Last Route Node.js backend (HTTP API + UDP gameplay relay)"
publish = false

# Standalone crate: NOT a member of the game's workspace.
[workspace]

[lib]
name = "lr_server"
path = "src/lib.rs"

[[bin]]
name = "lr_server"
path = "src/main.rs"

[dependencies]
# preserve_order keeps object keys in insertion order, like JSON.stringify in Node.
serde_json = { version = "1", features = ["preserve_order"] }
serde = "1"
indexmap = "2"
socket2 = "0.5"
sha2 = "0.10"
sha1_smol = "1"
hmac = "0.12"
scrypt = { version = "0.11", default-features = false }
getrandom = "0.2"
regex = "1"
tiny_http = "0.12"

# scrypt is unbearably slow unoptimised; keep dependencies fast in debug/test builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
